# nginx site config for fan-bus-rhythm-rush.
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/conf.d/fan-bus.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Debian/Ubuntu users: put it in /etc/nginx/sites-available/ and symlink into
# sites-enabled/ instead.
#
# Replace APP_DOMAIN below with the real hostname. Serving on 80/443 from a
# mainland-China host requires an ICP filing for that domain.

upstream fan_bus_app {
    # vinext binds 127.0.0.1 only (see deploy/fan-bus.service), so nginx is the
    # only way in.
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name APP_DOMAIN;

    # Static assets come straight off disk. nginx handles Range requests here,
    # which the Node server does not implement at all — that matters for the
    # <audio> element, which issues ranged requests when seeking.
    root /home/admin/fan-bus-rhythm-rush/dist/client;

    # The game's clock is the audio element's currentTime, so a stalled or
    # re-fetched track desyncs the whole chart. Give audio a long cache life.
    # `expires` emits its own Cache-Control, so adding one by hand would send
    # the header twice.
    location /audio/ {
        expires 30d;
        access_log off;
    }

    # Build output is content-hashed, so it can never go stale. Mirrors what
    # dist/client/_headers tells Cloudflare to do (nginx ignores that file).
    # `immutable` needs an explicit header, so `expires` is left out here to
    # avoid emitting a second, conflicting Cache-Control.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location = /favicon.svg { expires 7d; access_log off; }
    location = /og.png      { expires 7d; access_log off; }

    # Anything present on disk is served directly; everything else is a dynamic
    # route and goes to the app.
    location / {
        try_files $uri @app;
    }

    location @app {
        proxy_pass http://fan_bus_app;
        proxy_http_version 1.1;

        # app/layout.tsx builds metadataBase from these two headers. Without
        # them the OpenGraph image URL falls back to localhost:3000 and every
        # share card breaks.
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # vinext streams the SSR response. Buffering would hold the shell back
        # until the whole document is ready, which shows up as a blank screen.
        proxy_buffering off;
        proxy_cache off;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_set_header Connection "";
    }

    # Audio files are already compressed; re-compressing them wastes CPU for
    # nothing. Everything textual is worth gzipping.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    client_max_body_size 1m;
}

# After certbot runs it rewrites the block above to redirect to 443 and adds a
# TLS server block. Get a certificate with:
#   sudo certbot --nginx -d APP_DOMAIN
#
# HTTPS is worth doing early: some browsers restrict Web Audio and
# navigator.vibrate on insecure origins, and the game depends on both.
