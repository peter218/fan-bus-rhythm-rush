# nginx site config for fan-bus-rhythm-rush.
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/conf.d/fan-bus.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Debian/Ubuntu users: put it in /etc/nginx/sites-available/ and symlink into
# sites-enabled/ instead.
#
# Everything is proxied to the app except /audio/, which nginx reads off disk.
#
# That split is deliberate. The only thing nginx does better here is HTTP Range:
# vinext's server implements none — no Accept-Ranges, no 206 path anywhere in
# node_modules/vinext/dist/server — so the <audio> element cannot seek and
# aborts mid-download, which is what logs "Static file stream error: Premature
# close" against the bundled mp3s.
#
# Static assets need no such help. vinext already answers /assets/ with
# `Cache-Control: public, max-age=31536000, immutable` plus a hash-derived ETag
# (prod-server.js:328), so serving them from disk here would duplicate the
# config for no gain — and an audio_root that does not match the real deploy
# path would take the whole page down with it instead of just audio seeking.

upstream fan_bus_app {
    # The app binds 127.0.0.1 only (see deploy/fan-bus.service and
    # deploy/service.sh), so nginx is the only way in.
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    # default_server plus a catch-all name means a bare IP works too, so the
    # site is reachable before a domain exists or its ICP filing clears. Once
    # you have a domain and want to answer only for it, put the hostname in
    # server_name and drop default_server.
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Audio is the one path served from disk, for Range support. Adjust this to
    # your deploy location; if it is wrong, requests fall through to the app and
    # only lose seeking rather than breaking the site.
    #
    # Under a home directory this usually needs two things granted before nginx
    # can read it — see "nginx 读不到 /home 下的文件" in deploy/README.md:
    #   chmod o+x on every directory down the path, and on RHEL-family hosts
    #   (including Alibaba Cloud Linux) an httpd_sys_content_t SELinux label.
    # Without them nginx gets EACCES, falls back to the app, and audio silently
    # loses seeking while everything else keeps working.
    location /audio/ {
        root /home/admin/fan-bus-rhythm-rush/dist/client;
        expires 30d;
        access_log off;
        try_files $uri @app;
    }

    location / {
        proxy_pass http://fan_bus_app;
        proxy_http_version 1.1;

        # app/layout.tsx builds metadataBase from these two headers. Without
        # them the OpenGraph image URL falls back to localhost:3000 and every
        # share card breaks.
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # vinext streams the SSR response. Buffering would hold the shell back
        # until the whole document is ready, which shows up as a blank screen.
        proxy_buffering off;
        proxy_cache off;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_set_header Connection "";
    }

    # Named target for the try_files fallback above.
    location @app {
        proxy_pass http://fan_bus_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_set_header Connection "";
    }

    # No gzip here: vinext compresses its own responses, and the mp3s are
    # already compressed.

    client_max_body_size 1m;
}

# If nginx refuses to start with "a duplicate default server", the distro's own
# default site already claimed port 80. Remove it and reload:
#   sudo rm /etc/nginx/sites-enabled/default           # Debian/Ubuntu
#   sudo mv /etc/nginx/conf.d/default.conf{,.disabled} # RHEL/Alibaba Cloud Linux
#
# TLS needs a real domain — certbot cannot issue for a bare IP. Once the domain
# resolves here, put it in server_name above, then:
#   sudo certbot --nginx -d your-domain.com
#
# Worth doing early: some browsers restrict Web Audio and navigator.vibrate on
# insecure origins, and the game depends on both.
